<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{NAME}} · Dummy Flats</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html">Dummy Flats</a>
      <nav class="nav">
        <a href="./index.html">Flats</a>
        <a href="#enquire">Enquire</a>
      </nav>
    </header>
    <main class="page">
      <p class="crumbs">
        <a href="./index.html">Home</a> / <a href="./index.html">Flats</a> /
        <span id="crumb-name">{{NAME}}</span>
      </p>
      <div class="detail-layout">
        <div id="gallery" class="gallery" style="background-image: url('{{IMAGE}}')"></div>
        <aside class="facts-panel">
          <div
            id="listing-overview"
            aria-live="polite"
            data-facts='{"price":"{{PRICE}}","name":"{{NAME}}","livingSpace":"{{LIVING_SPACE}}","id":"{{ID}}","latitude":"{{LATITUDE}}","longitude":"{{LONGITUDE}}"}'
          ></div>
          <p id="address">{{ROOMS}} · {{ADDRESS}}</p>
          <a class="cta" id="enquire" href="mailto:viewings@dummyflats.example">Request a viewing</a>
        </aside>
      </div>
    </main>
    <footer class="site-footer">
      <span>Dummy Flats</span>
      <span>Listing details refresh markup every minute</span>
      <span id="layout-note" class="layout-note"></span>
    </footer>
    <script type="module" src="./js/detail.js"></script>
  </body>
</html>
